<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D5DF6"/>
      <stop offset="1" stop-color="#4433D6"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- ledger card -->
  <rect x="128" y="120" width="256" height="288" rx="28" fill="#FFFFFF" opacity="0.98"/>

  <!-- header bar of ledger -->
  <rect x="128" y="120" width="256" height="56" rx="28" fill="#FFFFFF"/>
  <rect x="128" y="148" width="256" height="28" fill="#FFFFFF"/>

  <!-- ledger lines (expense rows) -->
  <rect x="160" y="208" width="120" height="14" rx="7" fill="#D9D3FB"/>
  <rect x="160" y="246" width="150" height="14" rx="7" fill="#D9D3FB"/>
  <rect x="160" y="284" width="90" height="14" rx="7" fill="#D9D3FB"/>

  <!-- small dots to suggest amounts aligned right -->
  <circle cx="336" cy="215" r="7" fill="#B7ADF7"/>
  <circle cx="336" cy="253" r="7" fill="#B7ADF7"/>
  <circle cx="336" cy="291" r="7" fill="#B7ADF7"/>

  <!-- rising trend line accent -->
  <polyline points="160,352 208,332 248,344 300,308 344,320" fill="none" stroke="#6D5DF6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- yen coin badge -->
  <circle cx="372" cy="372" r="58" fill="url(#coin)" stroke="#FFFFFF" stroke-width="8"/>
  <text x="372" y="392" font-family="'Hiragino Sans', 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="700" fill="#8A5A0F" text-anchor="middle">¥</text>
</svg>
