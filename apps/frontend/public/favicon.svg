<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b5cff"/>
      <stop offset="1" stop-color="#7e14ff"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ede6ff"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe28a"/>
      <stop offset="1" stop-color="#f6b93b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- wallet flap -->
  <path d="M112 144a26 26 0 0 1 26-26h236a26 26 0 0 1 26 26v56H112z" fill="url(#wallet)"/>
  <!-- wallet body -->
  <rect x="88" y="184" width="336" height="220" rx="30" fill="url(#wallet)"/>
  <!-- wallet fold shadow -->
  <path d="M88 232a30 30 0 0 1 30-30h276a30 30 0 0 1 30 30v20H88z" fill="#cbb6ff"/>
  <!-- coin pocket / clasp -->
  <circle cx="350" cy="296" r="42" fill="url(#coin)" stroke="#c98a1d" stroke-width="4"/>
  <text x="350" y="311" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#8a5e10" text-anchor="middle">¥</text>
</svg>
